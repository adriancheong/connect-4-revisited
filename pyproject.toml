[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "connect4"
version = "0.1.0"
description = "Connect 4 with bots that learn to play using neural networks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
plots = ["matplotlib>=3.8"]

[project.scripts]
connect4 = "connect4.cli:main"

[tool.uv]
# Supply-chain safety: when choosing package versions, ignore anything published
# in the last 7 days. Most malicious releases are caught and removed within days.
exclude-newer = "7 days"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]  # zip(strict=...) adds noise to the teaching code
